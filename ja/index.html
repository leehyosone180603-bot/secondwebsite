      <h1>🌿 健康フロー｜日本語</h1>
      <p>韓国の健康情報サイト「健康フロー」の記事を日本語でお届けします。食べ物・症状・季節の健康ケアなど、暮らしに役立つ情報をまとめました。</p>
    </div>

      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7143828779500885" data-ad-slot="3265568294" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>

    <div class="ja-search"><input type="search" id="jaSearch" placeholder="🔍 キーワードで検索（例：みかん、乾燥、血圧）" aria-label="記事検索"></div>
    <div class="ja-cats" id="jaCats"></div>
    <div class="ja-grid" id="jaGrid"></div>
    <p class="ja-empty" id="jaEmpty" hidden>該当する記事がありません。</p>
  </main>

  <footer class="ja-footer">
    <p>健康フロー（けんこうフロー）· <a href="/">韓国語サイト</a></p>

  </footer>

  <script src="/js/ja-posts.js"></script>
  <script>
  (function () {
    var POSTS = (window.JA_POSTS || []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    var CATNAMES = { food: "健康食", info: "健康情報", disease: "病気", diet: "ダイエット", exercise: "運動" };
    function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    var grid = document.getElementById("jaGrid"), empty = document.getElementById("jaEmpty"), catsEl = document.getElementById("jaCats");
    var curCat = "all", q = "";
    var cats = ["all"].concat(Object.keys(CATNAMES).filter(function (c) { return POSTS.some(function (p) { return p.category === c; }); }));
    catsEl.innerHTML = cats.map(function (c) {
      return '<button data-c="' + c + '"' + (c === "all" ? ' class="on"' : '') + '>' + (c === "all" ? "すべて" : CATNAMES[c]) + '</button>';
    }).join("");
    function card(p) {
      var style = p.image ? ' style="background-image:url(' + esc(p.image) + ')"' : '';
      return '<a class="ja-card" href="' + esc(p.url) + '"><span class="thumb"' + style + '></span>' +
        '<span class="body"><span class="cat">' + (CATNAMES[p.category] || "健康情報") + '</span>' +
        '<span class="t">' + esc(p.title) + '</span><span class="d">' + esc(p.summary || "") + '</span></span></a>';
    }
    function render() {
      var list = POSTS.filter(function (p) {
        if (curCat !== "all" && p.category !== curCat) return false;
        if (q && (p.title + " " + (p.summary || "")).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      grid.innerHTML = list.map(card).join("");
      empty.hidden = list.length > 0;
    }
    catsEl.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-c]"); if (!b) return;
      curCat = b.getAttribute("data-c");
      Array.prototype.forEach.call(catsEl.children, function (x) { x.classList.toggle("on", x === b); });
      render();
    });
    document.getElementById("jaSearch").addEventListener("input", function () { q = this.value.trim().toLowerCase(); render(); });
    render();
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  })();
  </script>
