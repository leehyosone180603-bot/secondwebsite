<!DOCTYPE html>
<!--
  ==========================================================================
  ★ 새 글 작성 방법 (이 파일을 복사해서 사용하세요) ★
  1) 이 파일을 같은 폴더(/posts/)에 새 이름으로 복사합니다.
       예: posts/hyeolgwan-ap.html
  2) 아래 [   ] 안의 값들을 바꿔주세요.
       - <title>            : 브라우저 탭 제목
       - meta description   : 검색 노출용 요약 (1~2줄)
       - canonical href     : https://healthfortune.co.kr/posts/파일명.html
       - body data-cat      : "food" 또는 "info"
       - article__cat       : 화면에 보일 카테고리명
       - article__title     : 글 제목
       - article__meta      : 작성일
       - article__body      : 실제 본문 내용 (<p>, <h2>, <ul> 등 자유롭게)
  3) 마지막으로 /js/posts.js 의 POSTS 배열 맨 위에 이 글 정보를 추가합니다.
       (제목/요약/카테고리/날짜/url) → 홈과 카테고리 목록에 자동 노출됩니다.
  ==========================================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[글 제목] · 건강흐름</title>
  <meta name="description" content="[검색 노출용 요약을 1~2줄로 작성]">
  <link rel="canonical" href="https://healthfortune.co.kr/posts/[파일명].html">

  <meta property="og:type" content="article">
  <meta property="og:title" content="[글 제목]">
  <meta property="og:description" content="[요약]">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <!-- ★ 구글 애드센스 로더 ★ (승인 후 ca-pub-... 교체) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000"
          crossorigin="anonymous"></script>
</head>
<body data-cat="food"><!-- ← 이 글의 카테고리: "food"(건강음식) 또는 "info"(건강정보) -->
  <header id="site-header"></header>

  <main class="wrap">
    <article class="article">
      <span class="article__cat">건강음식</span><!-- ← 카테고리명 -->
      <h1 class="article__title">[글 제목을 입력하세요]</h1>
      <div class="article__meta">건강흐름 · 2026-08-13</div>

      <div class="article__body">
        <!-- ▼▼▼ 여기부터 본문을 작성하세요 ▼▼▼ -->
        <p>여기에 첫 문단을 작성합니다.</p>

        <h2>소제목 예시</h2>
        <p>문단 내용을 작성합니다.</p>

        <!-- 글 중간 광고 (그대로 두면 됩니다) -->
        <div id="ad-in-article"></div>

        <p>이어지는 내용을 작성합니다.</p>
        <!-- ▲▲▲ 본문 끝 ▲▲▲ -->
      </div>

      <div class="article__nav"><a class="btn" href="/">‹ 홈으로</a></div>
    </article>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/posts.js"></script>
  <script src="/js/site.js"></script>
  <script>
    // 본문 중간 광고 삽입
    document.addEventListener("DOMContentLoaded", function () {
      var slot = document.getElementById("ad-in-article");
      if (slot) { slot.innerHTML = adUnit("inArticle", "본문"); activateAds(); }
    });
  </script>
</body>
</html>
