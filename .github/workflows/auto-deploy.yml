name: Auto deploy to main

# 예약(자동 발행) 세션은 보안 정책상 작업 브랜치에만 push할 수 있습니다.
# 이 워크플로가 작업 브랜치 push를 감지해 main(=GitHub Pages 라이브)으로 자동 반영합니다.

on:
  push:
    branches:
      - claude/healthflow-revenue-site-ivop3c

permissions:
  contents: write

concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  mirror-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: claude/healthflow-revenue-site-ivop3c
          fetch-depth: 0
      - name: Fast-forward main to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "work branch HEAD: $(git rev-parse HEAD)"
          # 작업 브랜치가 소스 오브 트루스. main 을 이 커밋으로 fast-forward.
          git push origin HEAD:main
          echo "main 을 작업 브랜치로 반영 완료"
