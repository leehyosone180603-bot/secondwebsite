name: Auto deploy to main

# 예약(자동 발행) 세션은 보안 정책상 작업 브랜치에만 push할 수 있습니다.
# 이 워크플로가 작업 브랜치 push를 감지해 main(=GitHub Pages 라이브)으로 반영합니다.
#
# ★ 분기 자동 흡수:
#   예전에는 main 을 단순 fast-forward(`git push HEAD:main`) 만 했기 때문에,
#   누군가 작업 브랜치를 거치지 않고 main 에 직접 머지한 커밋이 생기면
#   (예: 서치콘솔 메타태그 PR) main 이 분기되어 push 가 거부 → 배포가 멈췄습니다.
#   이제는 분기를 감지하면 main 을 작업 브랜치에 자동 병합(merge)해 흡수한 뒤
#   그 결과를 main 으로 push 합니다. 따라서 더 이상 배포가 막히지 않습니다.
#   (같은 파일의 같은 줄이 양쪽에서 수정된 '진짜 충돌'일 때만 중단하고 알립니다.)

on:
  push:
    branches:
      - claude/healthflow-revenue-site-ivop3c

permissions:
  contents: write

concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  mirror-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch (full history)
        uses: actions/checkout@v4
        with:
          ref: claude/healthflow-revenue-site-ivop3c
          fetch-depth: 0

      - name: Mirror work branch to main (auto-absorb divergence)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WORK_SHA="$(git rev-parse HEAD)"
          echo "작업 브랜치 HEAD: $WORK_SHA"

          # main 이 아직 없으면 작업 브랜치로 생성하고 종료
          if ! git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "원격 main 없음 → 작업 브랜치로 생성"
            git push origin "HEAD:main"
            exit 0
          fi

          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "원격 main HEAD: $MAIN_SHA"

          # 1) 이미 동일 → 할 일 없음
          if [ "$WORK_SHA" = "$MAIN_SHA" ]; then
            echo "main 이 이미 최신 → 반영 불필요"
            exit 0
          fi

          # 2) main 이 작업 브랜치의 조상 → 정상 fast-forward
          if git merge-base --is-ancestor "$MAIN_SHA" "$WORK_SHA"; then
            echo "fast-forward 로 main 반영"
            git push origin "HEAD:main"
            echo "완료 (fast-forward)"
            exit 0
          fi

          # 3) 분기됨 → main 을 흡수 병합 후 그 결과를 main 으로 push
          echo "::warning::main 이 작업 브랜치와 분기됨 — 자동 병합으로 흡수합니다."
          if git merge --no-edit origin/main; then
            echo "병합 성공 → main 으로 push"
            git push origin "HEAD:main"
            echo "완료 (merge). main = 작업 브랜치 내용 + main 직접변경 모두 포함."
          else
            git merge --abort || true
            echo "::error::자동 병합 실패(충돌). main 과 작업 브랜치가 같은 파일의 같은 부분을 수정했습니다. 작업 브랜치에서 'git merge origin/main' 으로 수동 해결 후 다시 push 하세요."
            exit 1
          fi
