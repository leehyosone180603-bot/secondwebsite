<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="맥주와 소주 등 술">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf3ee"/><stop offset="1" stop-color="#f7e6df"/></linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#f0a92e"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sbg)"/>
  <rect x="0" y="70" width="240" height="66" fill="#c0392b"/>
  <text x="30" y="114" font-family="'Noto Sans KR',sans-serif" font-size="40" font-weight="800" fill="#fff">술</text>
  <!-- 맥주잔 -->
  <g transform="translate(500 360)">
    <path d="M-95 -120 L 95 -120 L 80 200 Q 78 220 58 220 L -58 220 Q -78 220 -80 200 Z" fill="url(#beer)"/>
    <path d="M-95 -120 L 95 -120 L 88 -60 L -88 -60 Z" fill="#fff" opacity="0.85"/>
    <ellipse cx="-70" cy="-120" rx="26" ry="20" fill="#fff"/>
    <ellipse cx="-20" cy="-134" rx="30" ry="24" fill="#fff"/>
    <ellipse cx="40" cy="-124" rx="28" ry="22" fill="#fff"/>
    <path d="M-95 -120 L 95 -120 L 80 200 Q 78 220 58 220 L -58 220 Q -78 220 -80 200 Z" fill="none" stroke="#d8b98a" stroke-width="5"/>
    <!-- 손잡이 -->
    <path d="M95 -70 q 80 0 80 80 q 0 80 -80 80" fill="none" stroke="#d8b98a" stroke-width="18"/>
    <!-- 거품 방울 -->
    <g fill="#fff" opacity="0.6"><circle cx="-30" cy="40" r="8"/><circle cx="20" cy="90" r="6"/><circle cx="-10" cy="140" r="7"/></g>
  </g>
  <!-- 소주병 -->
  <g transform="translate(760 380)">
    <rect x="-32" y="-160" width="64" height="360" rx="16" fill="#3f9d63"/>
    <rect x="-16" y="-215" width="32" height="60" rx="6" fill="#3f9d63"/>
    <rect x="-32" y="-70" width="64" height="90" rx="6" fill="#f4f7f2"/>
    <rect x="-32" y="-160" width="20" height="360" rx="10" fill="#fff" opacity="0.25"/>
  </g>
  <!-- 금지 배지 -->
  <g transform="translate(1050 150)">
    <circle r="62" fill="none" stroke="#e03131" stroke-width="14"/>
    <line x1="-44" y1="-44" x2="44" y2="44" stroke="#e03131" stroke-width="14"/>
  </g>
</svg>
