<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="계란과 부추">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f8ee"/><stop offset="1" stop-color="#e6f2e2"/></linearGradient>
    <radialGradient id="y3" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#f2a825"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bbg)"/>
  <rect x="0" y="70" width="170" height="66" fill="#2f9e6f"/>
  <text x="30" y="114" font-family="'Noto Sans KR',sans-serif" font-size="40" font-weight="800" fill="#fff">부추</text>
  <!-- 부추 단 -->
  <g transform="translate(440 400)" stroke-linecap="round" fill="none">
    <g stroke="#3f9d55" stroke-width="20">
      <path d="M-120 160 C -150 40, -120 -80, -80 -180"/>
      <path d="M-70 160 C -90 40, -70 -90, -30 -200"/>
      <path d="M-20 160 C -30 30, -10 -100, 20 -190"/>
      <path d="M40 160 C 30 40, 60 -80, 95 -180"/>
      <path d="M95 160 C 100 40, 120 -70, 150 -160"/>
    </g>
    <g stroke="#57b56a" stroke-width="8">
      <path d="M-95 100 C -110 20, -95 -70, -70 -150"/>
      <path d="M10 100 C 5 20, 25 -80, 45 -160"/>
    </g>
    <!-- 묶음 끈 -->
    <rect x="-135" y="120" width="290" height="34" rx="10" fill="#c98a3a" stroke="none"/>
