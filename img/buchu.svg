    <circle cx="10" cy="-10" r="52" fill="url(#y3)"/>
  </g>
  <!-- + 배지 -->
  <g transform="translate(650 250)">
    <circle r="42" fill="#2f9e6f"/>
    <rect x="-20" y="-6" width="40" height="12" rx="6" fill="#fff"/>
    <rect x="-6" y="-20" width="12" height="40" rx="6" fill="#fff"/>
