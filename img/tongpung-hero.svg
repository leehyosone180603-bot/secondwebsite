<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="통풍에 좋지 않아 피해야 할 음식을 나타낸 이미지">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf0ec"/>
      <stop offset="1" stop-color="#fbe2dd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#gbg)"/>
  <!-- 접시 -->
  <g transform="translate(600 350)">
    <circle r="210" fill="#ffffff"/>
    <circle r="210" fill="none" stroke="#e7cfc9" stroke-width="6"/>
    <circle r="150" fill="none" stroke="#efe0dc" stroke-width="4"/>
    <!-- 포크 -->
    <g fill="#c9a24a">
      <rect x="-118" y="-95" width="10" height="120" rx="5"/>
      <rect x="-140" y="-95" width="7" height="55" rx="3"/>
      <rect x="-126" y="-95" width="7" height="55" rx="3"/>
      <rect x="-104" y="-95" width="7" height="55" rx="3"/>
      <rect x="-132" y="25" width="34" height="80" rx="8"/>
    </g>
    <!-- 나이프 -->
    <g fill="#c9a24a">
      <path d="M112 -95 q 22 40 6 120 l -12 0 l 0 -120 z"/>
      <rect x="100" y="25" width="18" height="80" rx="8"/>
    </g>
  </g>
  <!-- 금지 링 -->
  <g transform="translate(600 350)">
    <circle r="185" fill="none" stroke="#e03131" stroke-width="30" opacity="0.9"/>
    <line x1="-131" y1="-131" x2="131" y2="131" stroke="#e03131" stroke-width="30" opacity="0.9"/>
  </g>
  <!-- 경고 삼각형 -->
  <g transform="translate(1010 150)">
    <path d="M0 -46 L 42 34 L -42 34 Z" fill="#f4b400" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-5" y="-18" width="10" height="30" rx="3" fill="#5a4200"/>
    <circle cx="0" cy="22" r="5" fill="#5a4200"/>
  </g>
</svg>
