<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="호박씨">
  <defs>
    <linearGradient id="hsbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7ec"/><stop offset="1" stop-color="#f0f0dd"/></linearGradient>
    <linearGradient id="seed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7c465"/><stop offset="1" stop-color="#8ea24a"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hsbg)"/>
  <rect x="0" y="70" width="200" height="66" fill="#2f9e6f"/>
  <text x="30" y="114" font-family="'Noto Sans KR',sans-serif" font-size="40" font-weight="800" fill="#fff">호박씨</text>
  <!-- 나무 그릇 -->
  <g transform="translate(600 420)">
    <ellipse cx="0" cy="-6" rx="230" ry="66" fill="#e7d3b0"/>
    <ellipse cx="0" cy="-10" rx="230" ry="60" fill="#f0e2c6"/>
    <!-- 씨앗 무더기 -->
    <g fill="url(#seed)" stroke="#7d8f3f" stroke-width="3">
      <g id="s"><path d="M0 -34 C 22 -34, 24 0, 0 6 C -24 0, -22 -34, 0 -34 Z"/></g>
      <use href="#s" transform="translate(-120 -14) rotate(-18)"/>
      <use href="#s" transform="translate(-70 -34) rotate(12)"/>
      <use href="#s" transform="translate(-20 -18) rotate(-8)"/>
      <use href="#s" transform="translate(40 -40) rotate(20)"/>
      <use href="#s" transform="translate(95 -20) rotate(-14)"/>
      <use href="#s" transform="translate(150 -34) rotate(10)"/>
      <use href="#s" transform="translate(-95 -48) rotate(6)"/>
      <use href="#s" transform="translate(10 -50) rotate(-22)"/>
      <use href="#s" transform="translate(120 -52) rotate(16)"/>
    </g>
    <path d="M-232 -6 Q -210 150 0 158 Q 210 150 232 -6 Z" fill="#dcc39a"/>
    <path d="M-232 -6 Q -210 150 0 158 Q 210 150 232 -6 Z" fill="none" stroke="#c9ad7f" stroke-width="5"/>
  </g>
  <!-- 흩어진 씨앗 -->
  <g fill="url(#seed)" stroke="#7d8f3f" stroke-width="3">
    <path d="M300 560 C 322 560, 324 594, 300 600 C 276 594, 278 560, 300 560 Z" transform="rotate(30 300 580)"/>
    <path d="M900 560 C 922 560, 924 594, 900 600 C 876 594, 878 560, 900 560 Z" transform="rotate(-20 900 580)"/>
  </g>
</svg>
