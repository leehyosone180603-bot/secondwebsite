<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="에어컨 찬 바람과 냉방병을 표현한 이미지">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf5fb"/><stop offset="1" stop-color="#dbeef8"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4edf3"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#nbg)"/>
  <!-- 에어컨 실내기 -->
  <g transform="translate(600 150)">
    <rect x="-260" y="-40" width="520" height="120" rx="24" fill="url(#ac)" stroke="#cfdbe4" stroke-width="4"/>
    <rect x="-260" y="40" width="520" height="26" rx="10" fill="#cfe0ea"/>
    <circle cx="210" cy="12" r="7" fill="#7fc7d6"/>
    <rect x="-230" y="-14" width="140" height="10" rx="5" fill="#e0e9ef"/>
  </g>
  <!-- 찬 바람 -->
  <g fill="none" stroke="#7fc7d6" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M420 250 q 40 40 0 80 q -40 40 0 80"/>
    <path d="M520 260 q 40 40 0 80 q -40 40 0 80"/>
    <path d="M680 260 q -40 40 0 80 q 40 40 0 80"/>
    <path d="M780 250 q -40 40 0 80 q 40 40 0 80"/>
  </g>
  <!-- 눈송이 -->
  <g stroke="#5aa6c4" stroke-width="5" stroke-linecap="round">
    <g transform="translate(360 430)"><line x1="-18" y1="0" x2="18" y2="0"/><line x1="0" y1="-18" x2="0" y2="18"/><line x1="-13" y1="-13" x2="13" y2="13"/><line x1="-13" y1="13" x2="13" y2="-13"/></g>
    <g transform="translate(840 400) scale(0.8)"><line x1="-18" y1="0" x2="18" y2="0"/><line x1="0" y1="-18" x2="0" y2="18"/><line x1="-13" y1="-13" x2="13" y2="13"/><line x1="-13" y1="13" x2="13" y2="-13"/></g>
    <g transform="translate(600 500) scale(0.7)"><line x1="-18" y1="0" x2="18" y2="0"/><line x1="0" y1="-18" x2="0" y2="18"/><line x1="-13" y1="-13" x2="13" y2="13"/><line x1="-13" y1="13" x2="13" y2="-13"/></g>
  </g>
  <!-- 오한 느끼는 사람 -->
  <g transform="translate(600 560)">
    <circle cx="0" cy="-40" r="34" fill="#f0c9a8"/>
    <path d="M-52 60 C -52 0, 52 0, 52 60 Z" fill="#6c8ea3"/>
    <path d="M-30 -46 q -8 -16 6 -22 M30 -46 q 8 -16 -6 -22" fill="none" stroke="#7a5b3a" stroke-width="4"/>
