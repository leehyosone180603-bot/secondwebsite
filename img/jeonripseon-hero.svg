    <g transform="translate(-14 22)" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round">
      <circle cx="0" cy="18" r="42"/>
      <line x1="30" y1="-12" x2="72" y2="-54"/>
      <path d="M48 -54 L 72 -54 L 72 -30"/>
    </g>
  </g>
  <!-- 반짝임 -->
  <g fill="#3aa6a0">
    <path d="M860 200 l 9 24 l 24 9 l -24 9 l -9 24 l -9 -24 l -24 -9 l 24 -9 z"/>
    <path d="M320 230 l 7 18 l 18 7 l -18 7 l -7 18 l -7 -18 l -18 -7 l 18 -7 z"/>
  </g>
  <!-- 토마토 -->
  <g transform="translate(880 430)"><circle r="52" fill="#e2503f"/><path d="M-6 -52 q 10 -14 24 -8 q -6 14 -24 8z" fill="#4aa564"/></g>
  <!-- 브로콜리 힌트 -->
  <g transform="translate(320 440)"><circle cx="-18" cy="-10" r="20" fill="#4a9c5a"/><circle cx="14" cy="-16" r="22" fill="#3f8d50"/><circle cx="0" cy="8" r="20" fill="#57ab67"/><rect x="-8" y="10" width="16" height="34" rx="6" fill="#bcd9a0"/></g>
