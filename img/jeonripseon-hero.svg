<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="전립선·남성 건강을 지키는 음식 이미지">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6f4"/><stop offset="1" stop-color="#e3eef2"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa6a0"/><stop offset="1" stop-color="#2a7f86"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pbg)"/>
  <!-- 방패 -->
  <g transform="translate(600 340)">
    <path d="M0 -170 C 90 -120, 150 -120, 150 -120 C 150 40, 90 150, 0 195 C -90 150, -150 40, -150 -120 C -150 -120, -90 -120, 0 -170 Z" fill="url(#shield)"/>
    <path d="M0 -150 C 78 -108, 128 -108, 128 -108 C 128 30, 78 128, 0 168 C -78 128, -128 30, -128 -108 C -128 -108, -78 -108, 0 -150 Z" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
