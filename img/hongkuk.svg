<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="붉은 홍국쌀로 지은 밥 한 그릇">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf2ef"/>
      <stop offset="1" stop-color="#f6e5e0"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d9d3"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#96271c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hbg)"/>
  <!-- 라벨 리본 -->
  <rect x="0" y="70" width="330" height="66" fill="#c0392b"/>
  <text x="30" y="114" font-family="'Noto Sans KR',sans-serif" font-size="40" font-weight="800" fill="#fff">홍국쌀</text>
  <!-- 밥 그릇 -->
  <g transform="translate(600 355)">
    <!-- 밥 봉우리 -->
    <path d="M-215 20 Q -120 -140 0 -140 Q 120 -140 215 20 Z" fill="url(#rice)"/>
    <!-- 쌀알 텍스처 -->
    <g fill="#e0685a" opacity="0.9">
      <ellipse cx="-120" cy="-30" rx="12" ry="6" transform="rotate(25 -120 -30)"/>
      <ellipse cx="-60" cy="-70" rx="12" ry="6" transform="rotate(-15 -60 -70)"/>
      <ellipse cx="20" cy="-90" rx="12" ry="6" transform="rotate(10 20 -90)"/>
      <ellipse cx="90" cy="-50" rx="12" ry="6" transform="rotate(-20 90 -50)"/>
      <ellipse cx="140" cy="0" rx="12" ry="6" transform="rotate(30 140 0)"/>
      <ellipse cx="-160" cy="0" rx="12" ry="6" transform="rotate(-10 -160 0)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="6" transform="rotate(15 0 -30)"/>
      <ellipse cx="60" cy="-10" rx="12" ry="6" transform="rotate(-25 60 -10)"/>
    </g>
    <!-- 그릇 -->
    <path d="M-250 10 L 250 10 Q 210 190 0 200 Q -210 190 -250 10 Z" fill="url(#bowl)"/>
    <path d="M-250 10 L 250 10 Q 210 190 0 200 Q -210 190 -250 10 Z" fill="none" stroke="#d8c4bc" stroke-width="5"/>
    <ellipse cx="0" cy="10" rx="250" ry="34" fill="#efe2dc"/>
    <ellipse cx="0" cy="6" rx="250" ry="30" fill="url(#rice)"/>
    <!-- 김(수증기) -->
    <g stroke="#e6b8b0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M-60 -150 q -20 -30 0 -60 q 20 -30 0 -60"/>
      <path d="M60 -150 q 20 -30 0 -60 q -20 -30 0 -60"/>
    </g>
  </g>
</svg>
