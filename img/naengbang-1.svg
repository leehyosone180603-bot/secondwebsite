<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="오한과 근육통">
  <defs><linearGradient id="o1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#e0edf7"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#o1)"/>
  <rect x="0" y="70" width="270" height="66" fill="#2b6cb0"/>
  <text x="30" y="114" font-family="'Noto Sans KR',sans-serif" font-size="38" font-weight="800" fill="#fff">오한·근육통</text>
  <!-- 체온계 -->
  <g transform="translate(520 360)">
    <rect x="-26" y="-180" width="52" height="300" rx="26" fill="#fff" stroke="#c7d5e0" stroke-width="6"/>
    <circle cx="0" cy="130" r="52" fill="#fff" stroke="#c7d5e0" stroke-width="6"/>
    <circle cx="0" cy="130" r="34" fill="#5aa6c4"/>
    <rect x="-12" y="20" width="24" height="120" rx="12" fill="#5aa6c4"/>
    <g stroke="#c7d5e0" stroke-width="5"><line x1="30" y1="-140" x2="52" y2="-140"/><line x1="30" y1="-80" x2="52" y2="-80"/><line x1="30" y1="-20" x2="52" y2="-20"/></g>
  </g>
  <!-- 눈송이 -->
  <g stroke="#5aa6c4" stroke-width="6" stroke-linecap="round">
    <g transform="translate(760 300)"><line x1="-22" y1="0" x2="22" y2="0"/><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-16" y1="-16" x2="16" y2="16"/><line x1="-16" y1="16" x2="16" y2="-16"/></g>
    <g transform="translate(860 440) scale(0.7)"><line x1="-22" y1="0" x2="22" y2="0"/><line x1="0" y1="-22" x2="0" y2="22"/><line x1="-16" y1="-16" x2="16" y2="16"/><line x1="-16" y1="16" x2="16" y2="-16"/></g>
  </g>
  <!-- 오한(떨림) 표시 -->
  <g fill="#2b6cb0" font-family="sans-serif" font-size="40" font-weight="800" opacity="0.6">
    <text x="720" y="520">~</text><text x="770" y="500">~</text>
  </g>
</svg>
